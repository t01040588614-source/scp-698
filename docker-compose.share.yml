# 팀/외부 접속용 — docker compose -f docker-compose.yml -f docker-compose.share.yml up -d --build
services:
  edge:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  db:
    ports: []

  redis:
    ports: []

  api:
    ports: []

  web:
    ports: []
