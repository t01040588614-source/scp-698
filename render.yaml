# MarketLens — Render Free Blueprint
# Dashboard → New → Blueprint → GitHub repo 연결 후 이 파일로 생성
# 무료: Postgres 1 + Web 2 (API + 프론트). Redis 없음(메모리 폴백).

databases:
  - name: marketlens-db
    plan: free
    databaseName: krstock
    user: krstock

services:
  - type: web
    name: marketlens-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./stock-backend/Dockerfile
    dockerContext: ./stock-backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketlens-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: REDIS_URL
        value: ""
      - key: INTEGRATIONS_ALLOW_UI_SAVE
        value: "false"
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.onrender\\.com$"
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","http://127.0.0.1:3000"]'
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      # 무료 인스턴스(0.1 CPU) 과부하 방지 — 장중 기본값(1~3초 갱신, 0.35초 푸시)은 너무 무거움
      - key: MARKET_REFRESH_FULL_SEC
        value: "60"
      - key: MARKET_REFRESH_FAST_SEC
        value: "15"
      - key: MARKET_REFRESH_INDEX_SEC
        value: "30"
      - key: MARKET_WS_BROADCAST_SEC
        value: "2"

  - type: web
    name: marketlens-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./my-frontend/Dockerfile
    dockerContext: ./my-frontend
    healthCheckPath: /
    envVars:
      - key: STOCK_API_PROXY
        fromService:
          type: web
          name: marketlens-api
          property: host
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: marketlens-api
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: marketlens-api
          property: host
      - key: NEXT_PUBLIC_QUOTE_REFRESH_PRESET
        value: live
